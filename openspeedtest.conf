# OpenSpeedTest LAN server (HTTP only). Bound on all interfaces so phones
# and laptops on the same site can hit this box. Static files only.
server {
    listen 3000;
    server_name _;
    root /usr/share/openspeedtest;
    index index.html;

    client_max_body_size 35m;
    error_page 405 =200 $uri;
    access_log off;
    gzip off;
    log_not_found off;
    server_tokens off;
    error_log /tmp/ost-nginx.log warn;
    tcp_nodelay on;
    tcp_nopush on;
    sendfile on;
    open_file_cache max=200000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off;

    location / {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Headers "Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Cache-Control "no-store, no-cache, max-age=0, no-transform";
        if_modified_since off;
        expires off;
        etag off;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    location ~* \.(?:css|js|jpe?g|gif|ico|png|svg|woff2?)$ {
        access_log off;
        expires 365d;
        add_header Cache-Control public;
        gzip on;
    }
}
